  zonas:
    activa: true
    antetitulo: Dónde vamos
    titulo: Alcañiz y el Bajo Aragón
    texto: "Recogemos y entregamos en casa y en la oficina. Lo que se puede resolver a distancia lo hacemos por asistencia remota."
    imagen: /fotos/zonas.jpg
    titulo_pagina: "Servicio técnico informático en {zona}"
    texto_pagina: "Reparamos ordenadores, portátiles e impresoras en {zona} y llevamos la informática de sus comercios y oficinas. Recogida a domicilio y asistencia remota."
    items:
      - titulo: Alcañiz
        texto: "Aquí está la tienda, en la Avenida de Aragón, y aquí hacemos la mayor parte del trabajo. Si estás en Alcañiz, puedes traer el ordenador sin cita o te lo recogemos en casa el mismo día. Llevamos la informática de muchos comercios del centro y de oficinas del polígono: redes, copias de seguridad, TPV e impresoras. Para lo que no necesita abrir el equipo, como un programa que no arranca o una impresora que no aparece, te ayudamos por asistencia remota en unos minutos."
      - titulo: Calanda
        texto: "Calanda está muy cerca de la tienda y vamos a menudo. Recogemos ordenadores y portátiles a domicilio y te los devolvemos reparados, con el precio cerrado de antemano. Atendemos también a comercios, bodegas y almacenes de fruta que necesitan que su red, su TPV o sus copias de seguridad funcionen todos los días, sobre todo en temporada."
      - titulo: Caspe
        texto: "En Caspe trabajamos sobre todo con despachos, gestorías y tiendas que nos confían el mantenimiento por cuota mensual. Vamos a revisar la instalación sin coste, te decimos qué mejoraríamos y lo dejamos por escrito. Las averías de casa también las atendemos: te recogemos el equipo y te lo devolvemos en cuanto está listo, sin que tengas que venir a Alcañiz."
      - titulo: Valderrobres
        texto: "Para Valderrobres y los pueblos del Matarraña combinamos visitas programadas con asistencia remota, porque muchas cosas se resuelven sin movernos. Instalamos wifi en casas de piedra de muros gruesos, donde la señal no pasa de una habitación a otra, y cámaras de vigilancia en casas de campo y alojamientos rurales que se ven desde el móvil."
      - { titulo: Castelserás }
      - { titulo: Alcorisa }
      - { titulo: Andorra }
      - { titulo: Híjar }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que nos dicen al recoger el equipo
    testimonios:
      - { texto: "El portátil de mi hija no arrancaba en plena época de exámenes. Me dijeron el precio por la mañana y por la tarde ya lo tenía, con todos sus apuntes.", autor: Pilar M., nota: "Cambio de disco, Alcañiz" }
      - { texto: "Nos llevan los ordenadores y la caja de la tienda. Cuando algo falla les escribo por WhatsApp y enseguida están conectados.", autor: Jorge A., nota: "Mantenimiento, Calanda" }
      - { texto: "Recuperaron las fotos de un disco que daba por perdido. Me enseñaron lo que se podía salvar antes de cobrarme nada.", autor: Mercedes L., nota: "Recuperación de datos, Caspe" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntáis en el mostrador
    texto: "¿No encuentras la tuya? Escríbenos por WhatsApp y te contestamos enseguida."
    preguntas:
      - { pregunta: "¿Cuánto cuesta el diagnóstico?", respuesta: "Nada. Miramos el equipo gratis y te decimos qué le pasa y cuánto cuesta arreglarlo. Si decides no repararlo, te lo llevas tal cual." }
      - { pregunta: "¿Voy a perder mis archivos?", respuesta: "No, salvo que el disco esté averiado, y en ese caso te lo decimos antes. Si hay que reinstalar el sistema, hacemos una copia de tus archivos y te los dejamos donde estaban." }
      - { pregunta: "¿Venís a casa o a la oficina?", respuesta: "Sí. Recogemos y entregamos en Alcañiz y en los pueblos del Bajo Aragón, y vamos a instalar redes, cámaras, TPV e impresoras. Muchas cosas las resolvemos además por asistencia remota." }
      - { pregunta: "¿Cuánto tarda una reparación?", respuesta: "La mayoría, entre uno y tres días. Si hay que pedir una pieza, te damos la fecha al hacer el presupuesto y te avisamos por WhatsApp en cuanto está listo." }
      - { pregunta: "¿Tenéis mantenimiento sin permanencia?", respuesta: "Sí. Las cuotas para empresas y autónomos son mensuales y puedes darte de baja cuando quieras. La primera revisión de tu instalación no cuesta nada." }

  contacto:
    activa: true
    antetitulo: Contacto
