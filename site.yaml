  reparaciones:
    activa: true
    antetitulo: Reparaciones
    titulo: Lo que arreglamos cada semana
    texto: "Precios orientativos con IVA. Te damos el precio de tu equipo antes de empezar."
    nota: "Pieza, mano de obra y garantía incluidas. Si no tiene arreglo, no pagas el diagnóstico."
    cta: { texto: Pide precio para tu equipo, url: "/#contacto" }
    reparaciones:
      - nombre: Ordenador lento
        texto: "Disco SSD, más memoria y el sistema limpio de programas que sobran."
        equipo: Ordenador
        plazo: "24 horas"
        precio: "desde 59 €"
        detalle: |
          Cuando un ordenador tarda minutos en arrancar o se queda pensando al abrir el correo, casi nunca hace falta comprar otro. Lo normal es que tenga un disco duro de los de antes y poca memoria, y las dos cosas se cambian por mucho menos de lo que cuesta un equipo nuevo.

          Primero lo miramos gratis para ver el estado del disco, de la memoria y del sistema. Después te decimos qué merece la pena: cambiar el disco por uno SSD, ampliar la memoria si tu equipo lo admite o quitar los programas que arrancan sin que lo sepas. Pasamos tus archivos al disco nuevo para que lo encuentres todo donde lo dejaste.

          Aprovechamos para limpiar el polvo de dentro y revisar el ventilador. Te lo devolvemos en un día, con garantía por escrito, y te explicamos sin tecnicismos qué hemos hecho. Si lo mejor es no tocar nada, también te lo decimos.
      - nombre: Cambio de pantalla de portátil
        texto: "Panel nuevo compatible con tu modelo, montado y probado."
        equipo: Portátil
        plazo: "2 a 4 días"
        precio: "desde 89 €"
        imagen: /fotos/reparacion-pantalla.jpg
        detalle: |
          Una pantalla rota, con rayas o que se ve negra no significa que el portátil esté perdido. Buscamos el panel exacto de tu modelo, lo montamos con cuidado para no forzar las bisagras ni el cable de vídeo y lo probamos con brillo, colores y cámara antes de devolvértelo.

          Si tenemos la pieza en la tienda, lo tienes en el día. Si hay que pedirla, te damos la fecha al hacer el presupuesto y te avisamos por WhatsApp en cuanto llega. Tus archivos no se tocan: no hace falta que nos des la contraseña.

          A veces el problema no es la pantalla sino el cable o la tarjeta de vídeo. Por eso primero lo diagnosticamos gratis y te decimos qué tiene de verdad. El precio que te damos es cerrado, con la pieza, la mano de obra y la garantía.
      - nombre: Recuperación de datos
        texto: "Fotos y documentos de discos, memorias USB y tarjetas que no abren."
        equipo: Datos
        plazo: "Según el daño"
        precio: "desde 60 €"
        imagen: /fotos/reparacion-datos.jpg
        detalle: |
          Si tu disco ya no aparece, hace ruidos o el ordenador te pide formatear la memoria USB, lo primero es no seguir intentándolo. Cada vez que se enchufa un disco dañado se pueden perder más archivos. Apágalo y tráenoslo tal cual.

          Hacemos una copia del disco antes de trabajar con él, para no tocar nunca el original, y desde esa copia recuperamos fotos, documentos, correos y contabilidad. Te enseñamos la lista de lo que se puede salvar antes de cobrarte nada y te lo entregamos en un disco nuevo o en una memoria.

          Si el disco tiene una avería física que necesita sala blanca, te lo decimos con honestidad y te damos opciones. Tus datos son tuyos: no los miramos más allá de comprobar que se abren y los borramos de nuestros equipos al terminar.
      - nombre: Limpieza y pasta térmica
        texto: "Para el ruido y el calor: ventiladores limpios y pasta nueva."
        equipo: Ordenador
        plazo: "En el día"
        precio: "desde 35 €"
        imagen: /fotos/reparacion-limpieza.jpg
        detalle: |
          Un ordenador que suena como un avión, que se calienta mucho o que se apaga solo suele tener el ventilador lleno de polvo y la pasta térmica seca. Es una de las reparaciones más agradecidas: vuelve a ir fresco y en silencio, y le alargas la vida.

          Lo abrimos, limpiamos con aire y pincel el ventilador, el disipador y las rejillas, cambiamos la pasta térmica del procesador y comprobamos las temperaturas con el equipo trabajando. En los portátiles revisamos también las bisagras y la batería, que con el calor se estropean antes.

          Lo tienes listo en el día. Si vemos algo más, te llamamos antes de hacer nada.
      - { nombre: "Virus y ventanas que saltan solas", texto: "Limpieza del sistema y antivirus configurado.", equipo: Ordenador, plazo: "En el día", precio: "39 €" }
      - { nombre: "Instalación de Windows con tus archivos", texto: "Sistema nuevo, tus programas y tus documentos donde estaban.", equipo: Ordenador, plazo: "24 horas", precio: "45 €" }
      - { nombre: "Teclado o bisagras de portátil", texto: "Teclado nuevo de tu idioma o bisagras y carcasa reforzadas.", equipo: Portátil, plazo: "2 a 4 días", precio: "desde 49 €" }
      - { nombre: "Impresora que atasca o no imprime", texto: "Limpieza de cabezales, rodillos y configuración en red.", equipo: Impresora, plazo: "En el día", precio: "desde 30 €" }
      - { nombre: "Wifi que no llega a toda la casa", texto: "Puntos de acceso y cableado para que llegue a cada habitación.", equipo: Red y wifi, plazo: "Con cita", precio: "desde 60 €" }
      - { nombre: "Cámaras de vigilancia", texto: "Instalación, grabador y las cámaras en tu móvil.", equipo: Red y wifi, plazo: "Con cita", precio: "Consultar" }
      - { nombre: "Asistencia remota", texto: "Te conectamos desde la tienda y lo resolvemos en el momento.", equipo: Remoto, plazo: "En el momento", precio: "20 € la media hora" }

